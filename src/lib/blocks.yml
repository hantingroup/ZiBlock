# Text ========================================================================

- type: text
  message0: “ %1 ”
  args0:
    - &input_text
      type: field_input
      name: TEXT
  <<:
    - &text_text
      <<: &text
        <<: &statements
          previousStatement: null
          nextStatement: null
        style: text_blocks
      tooltip: "%{BKY_TEXT_TEXT_TOOLTIP}"
      helpUrl: "%{BKY_TEXT_TEXT_HELPURL}"

- type: text_multiline
  message0: ¶ %1
  args0:
    - &field_input_multiline
      type: field_multilinetext
      name: TEXT
  <<: *text_text

- type: translate
  message0: 〚 %1 〛
  args0: [*input_text]
  <<: &text_translate
    <<: *text
    tooltip: "%{BKY_TEXT_TRANSLATE_TOOLTIP}"
    helpUrl: "%{BKY_TEXT_TRANSLATE_HELPURL}"

- type: translate_multiline
  message0: ⟪ %1 ⟫
  args0: [*field_input_multiline]
  <<: *text_translate

- type: translate_block
  message0: "%1"
  args0:
    - &statement_body
      type: input_statement
      name: BODY
  <<: *text_translate

- type: lexicon
  message0: "词典 %1 输出 %2"
  args0:
    - { type: field_lexicon_name, name: NAME }
    - { type: field_lexicon_field, name: FIELD }
  message1: "查询 %1"
  args1:
    - { type: field_label, name: SUMMARY, text: "无" }
  <<:
    <<: *text
    mutator: lexicon_mutator
    extensions: [lexicon_block]

# Lexicon query blocks =======================================================
# Conditions output Cond:<kind>; lexicon_group binds one to a schema and
# outputs TzSegment; lexicon_and / lexicon_or live in lexicon-ui.ts.
# Connection checks encode the DSL grammar:
#   ! (Cond:* -> Cond:*) > & (TzClause) > | (TzQuery)

- type: lexicon_group
  message0: "组 %1 %2"
  args0:
    - { type: field_group_name, name: GROUP }
    - type: input_value
      name: ITEM
      check:
        - Cond:pinyin
        - Cond:wordLength
        - Cond:path
        - Cond:enumValue
        - Cond:index
        - Cond:regex
  output: "TzSegment"
  style: text_blocks
  extensions: [lexicon_group_block]

- type: lexicon_not
  message0: "非 %1"
  args0:
    - type: input_value
      name: ITEM
      check:
        - Cond:pinyin
        - Cond:wordLength
        - Cond:path
        - Cond:enumValue
        - Cond:index
        - Cond:regex
  output: "Cond:unknown"
  style: text_blocks
  extensions: [lexicon_not_block]

- type: lexicon_pinyin
  message0: "拼音 %1"
  args0:
    - { type: field_input, name: PATTERN }
  output: "Cond:pinyin"
  style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_word_length
  message0: "词长 %1 %2"
  args0:
    - type: field_dropdown
      name: COMPARISON
      options:
        - ["等于", "eq"]
        - ["大于", "gt"]
        - ["小于", "lt"]
        - ["不小于", "gte"]
        - ["不大于", "lte"]
    - { type: field_number, name: LENGTH, value: 2, min: 0, precision: 1 }
  output: "Cond:wordLength"
  style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_path
  message0: "路径 %1 %2"
  args0:
    - { type: field_input, name: PATH, text: "/辽宁省/沈阳市" }
    - type: field_dropdown
      name: DEPTH
      options:
        - ["直接子节点", "children"]
        - ["所有后代", "descendants"]
  output: "Cond:path"
  style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_enum
  message0: "枚举 %1"
  args0:
    - { type: field_enum_value, name: VALUE }
  output: "Cond:enumValue"
  style: text_blocks
  extensions: [lexicon_condition, lexicon_enum_block]

- type: lexicon_index
  message0: "索引 %1 到 %2"
  args0:
    - { type: field_number, name: START, value: 0, min: 0, precision: 1 }
    - { type: field_number, name: END, value: 0, min: 0, precision: 1 }
  output: "Cond:index"
  style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_regex
  message0: "正则 %1"
  args0:
    - { type: field_input, name: SOURCE }
  output: "Cond:regex"
  style: text_blocks
  extensions: [lexicon_condition]

# Math ========================================================================

- type: number
  message0: "# %1"
  args0:
    - <<: *input_text
      value: 0
  <<:
    - &math_number
      <<: &math_blocks
        <<: *statements
        style: math_blocks
      tooltip: "%{BKY_MATH_NUMBER_TOOLTIP}"
      helpUrl: "%{BKY_MATH_NUMBER_HELPURL}"

- type: number_block
  message0: "# %1"
  args0: [*statement_body]
  <<: *math_number

- type: calculate
  message0: = %1
  args0: [*input_text]
  <<: &math_calculate
    <<: *math_blocks
    tooltip: "%{BKY_MATH_CALCULATE_TOOLTIP}"
    helpUrl: "%{BKY_MATH_CALCULATE_HELPURL}"

- type: calculate_block
  message0: = %1
  args0: [*statement_body]
  <<: *math_calculate

- type: choice
  message0: 选择
  message1: "%1"
  args1: [*statement_body]
  <<: *math_blocks

# Controls ====================================================================

- type: controls_repeat
  message0: 重复 %1 次
  args0:
    - # &number_times
      type: field_number
      name: TIMES
      value: 10
      min: 0
      precision: 1
  message1: "%1"
  args1: [*statement_body]
  message2: 懒加载 %1
  args2: &checkbox_lazy
    - type: field_checkbox
      name: LAZY
      checked: TRUE
  <<:
    - *statements
    - &controls_repeat
      <<: # &loop_blocks
        style: loop_blocks
        <<: *statements
      tooltip: "%{BKY_CONTROLS_REPEAT_TOOLTIP}"
      helpUrl: "%{BKY_CONTROLS_REPEAT_HELPURL}"

- type: controls_repeat_block
  message0: 重复 %1
  args0:
    - # &statement_times
      type: input_statement
      name: TIMES
  message1: 次 %1
  args1: [*statement_body]
  message2: 懒加载 %1
  args2: *checkbox_lazy
  <<: *controls_repeat

# Variables ===================================================================

- type: variables_get
  message0: "%1"
  args0:
    - &variable_var
      type: field_variable
      name: VAR
      variable: "%{BKY_VARIABLES_DEFAULT_NAME}"
  <<:
    <<: &variable_blocks
      <<: *statements
      style: variable_blocks
      extensions: [contextMenu_variableSetterGetter]
    tooltip: "%{BKY_VARIABLES_GET_TOOLTIP}"
    helpUrl: "%{BKY_VARIABLES_GET_HELPURL}"

- type: variables_set
  message0: 设置 %1
  args0: [*variable_var]
  message1: 为 %1
  args1: [*statement_body]
  message2: "显示 %1"
  args2:
    - &checkbox_echo
      type: field_checkbox
      name: ECHO
  <<: &variables_set
    <<: *variable_blocks
    tooltip: "%{BKY_VARIABLES_SET_TOOLTIP}"
    helpUrl: "%{BKY_VARIABLES_SET_HELPURL}"

- type: variables_set_block
  message0: 设置 %1
  args0:
    - type: input_statement
      name: VAR
  message1: 为 %1
  args1: [*statement_body]
  message2: "显示 %1"
  args2: [*checkbox_echo]
  <<: *variables_set

- type: variables_get_linger
  message0: 导入 %1
  args0:
    - &input_scope
      type: field_input
      name: SCOPE
      text: scope
  <<: &variable_dynamic_blocks
    <<: *variable_blocks
    style: variable_dynamic_blocks

- type: variables_set_linger
  message0: 导出 %1 到 %2
  args0: [*variable_var, *input_scope]
  <<: *variable_dynamic_blocks
