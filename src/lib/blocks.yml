# Text/number fields become Scratch-style value slots when the blocks load:
# `field_input`, `field_number` and `field_multilinetext` arguments are turned
# into value inputs with editable literal shadow blocks (see shadow-slots.ts),
# so a value reporter can be dropped onto any of them.
#
# Every general block is a string expression (output String). Statement
# connections are reserved for the lexicon query C-shaped editor below.

# Text ========================================================================

- type: text
  message0: “ %1 ”
  args0:
    - { type: field_input, name: TEXT, shadow: false }
  <<:
    - &text_text
      <<: &text
        <<: &statements
          output: "String"
        style: text_blocks
      tooltip: "%{BKY_TEXT_TEXT_TOOLTIP}"
      helpUrl: "%{BKY_TEXT_TEXT_HELPURL}"

- type: text_multiline
  message0: ¶ %1
  args0:
    - { type: field_multilinetext, name: TEXT, shadow: false }
  <<: *text_text

- type: translate
  message0: 〚 %1 〛
  args0:
    - &input_text
      type: field_input
      name: TEXT
  <<: &text_translate
    <<: *text
    tooltip: "%{BKY_TEXT_TRANSLATE_TOOLTIP}"
    helpUrl: "%{BKY_TEXT_TRANSLATE_HELPURL}"

- type: translate_multiline
  message0: ⟪ %1 ⟫
  args0:
    - &field_input_multiline
      type: field_multilinetext
      name: TEXT
  <<: *text_translate

- type: translate_block
  message0: "%1"
  args0:
    - &statement_body
      type: input_value
      name: BODY
  <<: *text_translate

- type: slice
  message0: 切片 %1
  args0: [*statement_body]
  message1: 从 %1 到 %2 步长 %3
  args1:
    - { type: field_input, name: START, text: "0" }
    - { type: field_input, name: STOP }
    - { type: field_input, name: STEP }
  <<:
    <<: *text
    tooltip: 按 Python 切片语义从目标文本中切出一段

- type: transform
  message0: 滤镜 %1
  args0: [*statement_body]
  message1: 方式 %1
  args1:
    - { type: field_transform_name, name: OP }
  message2: 字符集 %1
  args2:
    - { type: field_input, name: CHARSET }
  message3: 写名 %1
  args3:
    - { type: field_input, name: CNAME }
  <<:
    <<: *text
    tooltip: 对目标文本应用字体或滤镜；字符集只对字体有效
    extensions: [transform_charset_visibility]

- type: alias
  message0: 别名 %1
  args0:
    - { type: field_alias_name, name: ALIAS }
  <<:
    <<: *text
    tooltip: 展开别名表里的别名；也可以直接输入

- type: alias_value
  message0: 别名 %1
  args0:
    - { type: field_alias_name, name: ALIAS }
  output: "String"
  style: text_blocks
  tooltip: 展开别名表里的别名；可作为值插入其它空槽

- type: lexicon
  message0: "词库 %1 输出 %2 查询"
  args0:
    - { type: field_lexicon_name, name: NAME }
    - { type: field_lexicon_field, name: FIELD }
  message1: "%1"
  args1:
    - &lexicon_query
      type: input_statement
      name: QUERY
      check: "TzQuery"
  <<:
    <<: *text
    tooltip: 查询按行「与」组合；「或者」分隔不同的「或」分支
    extensions: [lexicon_block]

- type: lexicon_value
  message0: "词库 %1 输出 %2"
  args0:
    - { type: field_lexicon_name, name: NAME }
    - { type: field_lexicon_field, name: FIELD }
  message1: "查询 %1"
  args1: [*lexicon_query]
  output: "String"
  style: text_blocks
  extensions: [lexicon_block]
  tooltip: 词库查询结果；可作为值插入其它空槽

# Lexicon query blocks =======================================================
# The query is a C-shaped statement input. Each condition line is one segment;
# consecutive lines are joined with & (AND). A bare 或者 separator starts a new
# | (OR) branch, so the stack maps directly onto the DSL grammar without
# parentheses. 非 and 组 are C-shaped wrappers around a query expression;
# 非 is expanded with De Morgan when it wraps several conditions or branches.

- type: lexicon_or
  message0: "或者"
  previousStatement: "TzQuery"
  nextStatement: "TzQuery"
  style: text_blocks
  tooltip: 分隔两个「或」分支；上下两侧各自按「与」组合，不接任何积木

- type: lexicon_not
  message0: "非 %1"
  args0:
    - type: input_statement
      name: ITEM
      check: "TzQuery"
  previousStatement: "TzQuery"
  nextStatement: "TzQuery"
  style: text_blocks
  extensions: [lexicon_not_block]
  tooltip: 包住查询条件并整体取反；多个「与」条件展开为 !a|!b，多个「或」分支展开为 !a&!b

- type: lexicon_group
  message0: "组 %1 %2"
  args0:
    - { type: field_group_name, name: GROUP }
    - type: input_statement
      name: ITEM
      check: "TzQuery"
  previousStatement: "TzQuery"
  nextStatement: "TzQuery"
  style: text_blocks
  extensions: [lexicon_group_block]
  tooltip: 给包住的每个条件加 @组；「与」行和「或」分支里的条件都会加组

- type: lexicon_pinyin
  message0: "拼音 %1"
  args0:
    - { type: field_input, name: PATTERN }
  <<: &condition_statement
    previousStatement: "TzQuery"
    nextStatement: "TzQuery"
    style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_length
  message0: "长度 %1 %2"
  args0:
    - type: field_dropdown
      name: COMPARISON
      options:
        - ["等于", "eq"]
        - ["大于", "gt"]
        - ["小于", "lt"]
        - ["不小于", "gte"]
        - ["不大于", "lte"]
    - { type: field_number, name: LENGTH, value: 2, min: 0, precision: 1 }
  <<: *condition_statement
  extensions: [lexicon_condition]

- type: lexicon_path
  message0: "路径 %1 %2"
  args0:
    - { type: field_input, name: PATH, text: "/辽宁省/沈阳市" }
    - type: field_dropdown
      name: DEPTH
      options:
        - ["直接子节点", "children"]
        - ["所有后代", "descendants"]
  <<: *condition_statement
  extensions: [lexicon_condition]

- type: lexicon_enum
  message0: "枚举 %1"
  args0:
    - { type: field_enum_value, name: VALUE }
  <<: *condition_statement
  extensions: [lexicon_condition, lexicon_enum_block]

- type: lexicon_index
  message0: "索引 %1 到 %2"
  args0:
    - { type: field_number, name: START, value: 0, min: 0, precision: 1 }
    - { type: field_number, name: END, value: 100, min: 1, precision: 1 }
  <<: *condition_statement
  extensions: [lexicon_condition]

- type: lexicon_regex
  message0: "正则 %1"
  args0:
    - { type: field_input, name: SOURCE }
  <<: *condition_statement
  extensions: [lexicon_condition]

# Math ========================================================================

- type: number
  message0: "# %1"
  args0:
    - <<: *input_text
      value: 0
  <<:
    - <<: &math_blocks
        <<: *statements
        style: math_blocks
      tooltip: "%{BKY_MATH_NUMBER_TOOLTIP}"
      helpUrl: "%{BKY_MATH_NUMBER_HELPURL}"

- type: calculate
  message0: = %1
  args0: [*input_text]
  <<:
    <<: *math_blocks
    tooltip: "%{BKY_MATH_CALCULATE_TOOLTIP}"
    helpUrl: "%{BKY_MATH_CALCULATE_HELPURL}"

- type: range
  message0: 随机数 %1 - %2
  args0: &range_bounds
    - { type: field_input, name: LEFT, text: "1" }
    - { type: field_input, name: RIGHT, text: "9" }
  message1: 格式 %1 字形 %2
  args1: &range_format
    - { type: field_input, name: FSPEC }
    - type: field_dropdown
      name: FUSR
      options:
        - [自动, ""]
        - [十进制 d, d]
        - [十六进制 x, x]
        - [十六进制 X, X]
        - [中文 cn, cn]
        - [中文大写 CN, CN]
        - [罗马 ro, ro]
        - [罗马 Unicode RO, RO]
        - [字符 u, u]
  message2: 分布 %1 读名 %2 写名 %3
  args2: &range_extra
    - type: field_dropdown
      name: DIST
      options:
        - [无, ""]
        - [正态, n]
        - [学生 t, t]
        - [卡方, x]
        - [F 分布, f]
        - [指数, e]
        - [柯西, c]
        - [威布尔, w]
        - [伽马, g]
        - [贝塔, β]
        - [对数正态, log]
        - [逻辑, logistic]
        - [拉普拉斯, l]
    - { type: field_input, name: RNAME }
    - { type: field_input, name: CNAME }
  message3: 多选分隔 %1 数量 %2
  args3: &range_count
    - type: field_dropdown
      name: CSEP
      options:
        - [无, ""]
        - [逗号 ，, ，]
        - [顿号 、, 、]
        - [空格, " "]
    - { type: field_input, name: COUNT }
  <<:
    <<: *math_blocks
    tooltip: 在左右边界之间取随机数；输出会贴合两端边界的字形与格式

- type: range_value
  message0: 随机数 %1 - %2
  args0: *range_bounds
  message1: 格式 %1 字形 %2
  args1: *range_format
  message2: 分布 %1 读名 %2 写名 %3
  args2: *range_extra
  message3: 多选分隔 %1 数量 %2
  args3: *range_count
  output: "String"
  style: math_blocks
  tooltip: 随机数值；可作为值插入其它空槽

- type: format
  message0: 格式化 %1
  args0: [*statement_body]
  message1: 格式 %1 字形 %2
  args1:
    - { type: field_input, name: FSPEC, text: ".2f" }
    - type: field_dropdown
      name: FUSR
      options:
        - [十进制 d, d]
        - [无, ""]
        - [十六进制 x, x]
        - [十六进制 X, X]
        - [中文 cn, cn]
        - [中文大写 CN, CN]
        - [罗马 ro, ro]
        - [罗马 Unicode RO, RO]
        - [字符 u, u]
  message2: 写名 %1
  args2:
    - { type: field_input, name: CNAME }
  <<:
    <<: *math_blocks
    tooltip: 把目标值按格式与字形重新渲染（不随机）

# Controls ====================================================================

- type: controls_repeat
  message0: 重复 %1 次
  args0:
    - # &number_times
      type: field_number
      name: TIMES
      value: 10
      min: 0
      precision: 1
  message1: "%1"
  args1: [*statement_body]
  message2: 懒加载 %1
  args2: &checkbox_lazy
    - type: field_checkbox
      name: LAZY
      checked: TRUE
  <<:
    - *statements
    - <<: # &loop_blocks
        style: loop_blocks
        <<: *statements
      tooltip: "%{BKY_CONTROLS_REPEAT_TOOLTIP}"
      helpUrl: "%{BKY_CONTROLS_REPEAT_HELPURL}"

# Variables ===================================================================

- type: variables_get
  message0: "%1"
  args0:
    - &variable_var
      type: field_variable
      name: VAR
      variable: "%{BKY_VARIABLES_DEFAULT_NAME}"
  <<:
    <<: &variable_blocks
      <<: *statements
      style: variable_blocks
      extensions: [contextMenu_variableSetterGetter]
    tooltip: "%{BKY_VARIABLES_GET_TOOLTIP}"
    helpUrl: "%{BKY_VARIABLES_GET_HELPURL}"

- type: variables_get_value
  message0: "%1"
  args0: [*variable_var]
  output: "String"
  style: variable_blocks
  extensions: [contextMenu_variableSetterGetter]
  tooltip: 变量值；可作为值插入其它空槽
  helpUrl: "%{BKY_VARIABLES_GET_HELPURL}"

- type: variables_set
  message0: 设置 %1
  args0: [*variable_var]
  message1: 为 %1
  args1: [*statement_body]
  message2: "显示 %1"
  args2:
    - &checkbox_echo
      type: field_checkbox
      name: ECHO
  <<: &variables_set
    <<: *variable_blocks
    tooltip: "%{BKY_VARIABLES_SET_TOOLTIP}"
    helpUrl: "%{BKY_VARIABLES_SET_HELPURL}"

- type: variables_set_block
  message0: 设置 %1
  args0:
    - type: input_value
      name: VAR
  message1: 为 %1
  args1: [*statement_body]
  message2: "显示 %1"
  args2: [*checkbox_echo]
  <<: *variables_set

- type: variables_get_linger
  message0: 导入 %1
  args0:
    - &input_scope
      type: field_input
      name: SCOPE
      text: scope
  <<: &variable_dynamic_blocks
    <<: *variable_blocks
    style: variable_dynamic_blocks

- type: variables_get_linger_value
  message0: 导入 %1
  args0: [*input_scope]
  output: "String"
  style: variable_dynamic_blocks
  tooltip: 导入的变量值；可作为值插入其它空槽

- type: variables_set_linger
  message0: 导出 %1 到 %2
  args0: [*variable_var, *input_scope]
  <<: *variable_dynamic_blocks

- type: inner_value_set
  message0: 写入内部值 %1 名 %2
  args0:
    - { type: field_input, name: FIELD, text: Range }
    - { type: field_input, name: NAME }
  message1: 值 %1
  args1: [*statement_body]
  message2: 输出 %1
  args2: [*checkbox_echo]
  <<:
    <<: *statements
    style: variable_blocks
    tooltip: 把值写进内部值表（作用域通常是 Range / Choice / Lex）

- type: inner_value_get
  message0: 读取内部值 %1 名 %2
  args0:
    - { type: field_input, name: FIELD }
    - { type: field_input, name: NAME }
  <<:
    <<: *statements
    style: variable_blocks
    tooltip: 读取内部值；作用域留空时按翻译器顺序查找

- type: inner_value_get_value
  message0: 读取内部值 %1 名 %2
  args0:
    - { type: field_input, name: FIELD }
    - { type: field_input, name: NAME }
  output: "String"
  style: variable_blocks
  tooltip: 读取内部值；可作为值插入其它空槽

# Settings ====================================================================

- type: config
  message0: 配置 %1
  args0:
    - type: field_dropdown
      name: ITEM
      options:
        - [允许变量名含下划线 vu, vu]
        - [禁止变量名含下划线, disable_cache_name_with_underscore]
        - [出错忽略 eig, eig]
        - [出错原样 ea, ea]
        - [出错缩写 eil, eil]
        - [出错抛错 er, er]
        - [计算输出上限 512, max_calculate_output_normal]
        - [计算输出上限 1024 cl, cl]
        - [计算输出无限 cu, cu]
        - [关闭 PUA 提示, disable_pua_warning]
        - [开启 PUA 提示, enable_pua_warning]
        - [关闭复制提示, disable_repeat_warning]
        - [开启复制提示, enable_repeat_warning]
        - [关闭词库提示, disable_lex_warning]
        - [开启词库提示, enable_lex_warning]
        - [大数走沙盒 cb, cb]
        - [关闭大数沙盒, disable_calc_bignum]
        - [除零为 inf zinf, zinf]
        - [除零为 nan znan, znan]
        - [除零为 0 zzero, zzero]
        - [除零报错 zerr, zerr]
  <<:
    <<: *statements
    style: text_blocks
    tooltip: 设置本次填字的配置项，输出为空

- type: nocensor
  message0: 关闭屏蔽 %1
  args0:
    - { type: field_input, name: OTP }
  <<:
    <<: *statements
    style: text_blocks
    tooltip: 用 6 位验证码关闭本次填字的屏蔽词；不填会提示当前验证码

- type: reset
  message0: 重置 %1
  args0:
    - { type: field_input, name: SEED }
  <<:
    <<: *statements
    style: text_blocks
    tooltip: 清空缓存与变量并重置随机；种子应放在最前面
