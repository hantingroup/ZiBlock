# Text ========================================================================

- type: text
  message0: “ %1 ”
  args0:
    - &input_text
      type: field_input
      name: TEXT
  <<:
    - &text_text
      <<: &text
        <<: &statements
          previousStatement: null
          nextStatement: null
        style: text_blocks
      tooltip: "%{BKY_TEXT_TEXT_TOOLTIP}"
      helpUrl: "%{BKY_TEXT_TEXT_HELPURL}"

- type: text_multiline
  message0: ¶ %1
  args0:
    - &field_input_multiline
      type: field_multilinetext
      name: TEXT
  <<: *text_text

- type: translate
  message0: 〚 %1 〛
  args0: [*input_text]
  <<: &text_translate
    <<: *text
    tooltip: "%{BKY_TEXT_TRANSLATE_TOOLTIP}"
    helpUrl: "%{BKY_TEXT_TRANSLATE_HELPURL}"

- type: translate_multiline
  message0: ⟪ %1 ⟫
  args0: [*field_input_multiline]
  <<: *text_translate

- type: translate_block
  message0: "%1"
  args0:
    - &statement_body
      type: input_statement
      name: BODY
  <<: *text_translate

- type: slice
  message0: 切片 %1
  args0: [*statement_body]
  message1: 从 %1 到 %2 步长 %3
  args1:
    - { type: field_input, name: START, text: "0" }
    - { type: field_input, name: STOP }
    - { type: field_input, name: STEP }
  <<:
    <<: *text
    tooltip: 按 Python 切片语义从目标文本中切出一段

- type: font
  message0: 字体 %1
  args0: [*statement_body]
  message1: 字体 %1 字符集 %2
  args1:
    - { type: field_font_name, name: FONT, text: 粗体 }
    - { type: field_input, name: CHARSET }
  message2: 写名 %1
  args2:
    - { type: field_input, name: CNAME }
  <<:
    <<: *text
    tooltip: 把目标文本逐字符替换成指定字体；字符集为空时替换全部字符

- type: filter
  message0: 滤镜 %1
  args0: [*statement_body]
  message1: 滤镜 %1
  args1:
    - type: field_dropdown
      name: OP
      options:
        - [小写 lower, lower]
        - [大写 upper, upper]
        - [标题 title, title]
        - [首字母大写 capitalize, capitalize]
        - [casefold, casefold]
        - [交换大小写 swapcase, swapcase]
        - [去首尾空白 strip, strip]
        - [去尾部空白 rstrip, rstrip]
        - [去首部空白 lstrip, lstrip]
        - [展开制表符 expandtabs, expandtabs]
        - [麻将 mahjong, mahjong]
        - [摩斯 morse, morse]
        - [乱序 shuffle, shuffle]
  message2: 写名 %1
  args2:
    - { type: field_input, name: CNAME }
  <<:
    <<: *text
    tooltip: 对目标文本应用字符串滤镜

- type: alias
  message0: 别名 %1
  args0:
    - { type: field_alias_name, name: ALIAS }
  <<:
    <<: *text
    tooltip: 展开别名表里的别名；也可以直接输入

- type: lexicon
  message0: "词典 %1 输出 %2"
  args0:
    - { type: field_lexicon_name, name: NAME }
    - { type: field_lexicon_field, name: FIELD }
  message1: "查询 %1"
  args1:
    - { type: field_label, name: SUMMARY, text: "无" }
  <<:
    <<: *text
    mutator: lexicon_mutator
    extensions: [lexicon_block]

# Lexicon query blocks =======================================================
# Conditions output Cond:<kind>; lexicon_group binds one to a schema and
# outputs TzSegment; lexicon_and / lexicon_or live in lexicon-ui.ts.
# Connection checks encode the DSL grammar:
#   ! (Cond:* -> Cond:*) > & (TzClause) > | (TzQuery)

- type: lexicon_group
  message0: "组 %1 %2"
  args0:
    - { type: field_group_name, name: GROUP }
    - type: input_value
      name: ITEM
      check:
        - Cond:pinyin
        - Cond:wordLength
        - Cond:path
        - Cond:enumValue
        - Cond:index
        - Cond:regex
  output: "TzSegment"
  style: text_blocks
  extensions: [lexicon_group_block]

- type: lexicon_not
  message0: "非 %1"
  args0:
    - type: input_value
      name: ITEM
      check:
        - Cond:pinyin
        - Cond:wordLength
        - Cond:path
        - Cond:enumValue
        - Cond:index
        - Cond:regex
  output: "Cond:unknown"
  style: text_blocks
  extensions: [lexicon_not_block]

- type: lexicon_pinyin
  message0: "拼音 %1"
  args0:
    - { type: field_input, name: PATTERN }
  output: "Cond:pinyin"
  style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_word_length
  message0: "词长 %1 %2"
  args0:
    - type: field_dropdown
      name: COMPARISON
      options:
        - ["等于", "eq"]
        - ["大于", "gt"]
        - ["小于", "lt"]
        - ["不小于", "gte"]
        - ["不大于", "lte"]
    - { type: field_number, name: LENGTH, value: 2, min: 0, precision: 1 }
  output: "Cond:wordLength"
  style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_path
  message0: "路径 %1 %2"
  args0:
    - { type: field_input, name: PATH, text: "/辽宁省/沈阳市" }
    - type: field_dropdown
      name: DEPTH
      options:
        - ["直接子节点", "children"]
        - ["所有后代", "descendants"]
  output: "Cond:path"
  style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_enum
  message0: "枚举 %1"
  args0:
    - { type: field_enum_value, name: VALUE }
  output: "Cond:enumValue"
  style: text_blocks
  extensions: [lexicon_condition, lexicon_enum_block]

- type: lexicon_index
  message0: "索引 %1 到 %2"
  args0:
    - { type: field_number, name: START, value: 0, min: 0, precision: 1 }
    - { type: field_number, name: END, value: 0, min: 0, precision: 1 }
  output: "Cond:index"
  style: text_blocks
  extensions: [lexicon_condition]

- type: lexicon_regex
  message0: "正则 %1"
  args0:
    - { type: field_input, name: SOURCE }
  output: "Cond:regex"
  style: text_blocks
  extensions: [lexicon_condition]

# Math ========================================================================

- type: number
  message0: "# %1"
  args0:
    - <<: *input_text
      value: 0
  <<:
    - &math_number
      <<: &math_blocks
        <<: *statements
        style: math_blocks
      tooltip: "%{BKY_MATH_NUMBER_TOOLTIP}"
      helpUrl: "%{BKY_MATH_NUMBER_HELPURL}"

- type: number_block
  message0: "# %1"
  args0: [*statement_body]
  <<: *math_number

- type: calculate
  message0: = %1
  args0: [*input_text]
  <<: &math_calculate
    <<: *math_blocks
    tooltip: "%{BKY_MATH_CALCULATE_TOOLTIP}"
    helpUrl: "%{BKY_MATH_CALCULATE_HELPURL}"

- type: calculate_block
  message0: = %1
  args0: [*statement_body]
  <<: *math_calculate

- type: choice
  message0: 选择
  message1: "%1"
  args1: [*statement_body]
  <<: *math_blocks

- type: range
  message0: 随机数 %1 - %2
  args0:
    - { type: field_input, name: LEFT, text: "1" }
    - { type: field_input, name: RIGHT, text: "9" }
  message1: 格式 %1 字形 %2
  args1:
    - { type: field_input, name: FSPEC }
    - type: field_dropdown
      name: FUSR
      options:
        - [自动, ""]
        - [十进制 d, d]
        - [十六进制 x, x]
        - [十六进制 X, X]
        - [中文 cn, cn]
        - [中文大写 CN, CN]
        - [罗马 ro, ro]
        - [罗马 Unicode RO, RO]
        - [字符 u, u]
  message2: 分布 %1 读名 %2 写名 %3
  args2:
    - type: field_dropdown
      name: DIST
      options:
        - [无, ""]
        - [正态, n]
        - [学生 t, t]
        - [卡方, x]
        - [F 分布, f]
        - [指数, e]
        - [柯西, c]
        - [威布尔, w]
        - [伽马, g]
        - [贝塔, β]
        - [对数正态, log]
        - [逻辑, logistic]
        - [拉普拉斯, l]
    - { type: field_input, name: RNAME }
    - { type: field_input, name: CNAME }
  message3: 多选分隔 %1 数量 %2
  args3:
    - type: field_dropdown
      name: CSEP
      options:
        - [无, ""]
        - [逗号 ，, ，]
        - [顿号 、, 、]
        - [空格, " "]
    - { type: field_input, name: COUNT }
  <<:
    <<: *math_blocks
    tooltip: 在左右边界之间取随机数；输出会贴合两端边界的字形与格式

- type: format
  message0: 格式化 %1
  args0: [*statement_body]
  message1: 格式 %1 字形 %2
  args1:
    - { type: field_input, name: FSPEC, text: ".2f" }
    - type: field_dropdown
      name: FUSR
      options:
        - [十进制 d, d]
        - [无, ""]
        - [十六进制 x, x]
        - [十六进制 X, X]
        - [中文 cn, cn]
        - [中文大写 CN, CN]
        - [罗马 ro, ro]
        - [罗马 Unicode RO, RO]
        - [字符 u, u]
  message2: 写名 %1
  args2:
    - { type: field_input, name: CNAME }
  <<:
    <<: *math_blocks
    tooltip: 把目标值按格式与字形重新渲染（不随机）

- type: reduce_calc
  message0: "# %1"
  args0:
    - type: field_dropdown
      name: OP
      options:
        - ["加 +", "+"]
        - ["减 -", "-"]
        - ["乘 *", "*"]
        - ["除 /", "/"]
        - ["整除 //", "//"]
        - ["取余 %", "%"]
        - ["幂 **", "**"]
        - ["按位与 &", "&"]
        - ["按位或 |", "|"]
        - ["按位异或 ^", "^"]
  message1: "%1"
  args1: [*statement_body]
  message2: 分隔 %1
  args2:
    - type: field_dropdown
      name: SEP
      options:
        - [逗号 ，, ，]
        - [顿号 、, 、]
        - [空格, " "]
  <<:
    <<: *math_blocks
    tooltip: 把各段按同一个分隔符拆开后从左到右做归约运算

# Controls ====================================================================

- type: controls_repeat
  message0: 重复 %1 次
  args0:
    - # &number_times
      type: field_number
      name: TIMES
      value: 10
      min: 0
      precision: 1
  message1: "%1"
  args1: [*statement_body]
  message2: 懒加载 %1
  args2: &checkbox_lazy
    - type: field_checkbox
      name: LAZY
      checked: TRUE
  <<:
    - *statements
    - &controls_repeat
      <<: # &loop_blocks
        style: loop_blocks
        <<: *statements
      tooltip: "%{BKY_CONTROLS_REPEAT_TOOLTIP}"
      helpUrl: "%{BKY_CONTROLS_REPEAT_HELPURL}"

- type: controls_repeat_block
  message0: 重复 %1
  args0:
    - # &statement_times
      type: input_statement
      name: TIMES
  message1: 次 %1
  args1: [*statement_body]
  message2: 懒加载 %1
  args2: *checkbox_lazy
  <<: *controls_repeat

# Variables ===================================================================

- type: variables_get
  message0: "%1"
  args0:
    - &variable_var
      type: field_variable
      name: VAR
      variable: "%{BKY_VARIABLES_DEFAULT_NAME}"
  <<:
    <<: &variable_blocks
      <<: *statements
      style: variable_blocks
      extensions: [contextMenu_variableSetterGetter]
    tooltip: "%{BKY_VARIABLES_GET_TOOLTIP}"
    helpUrl: "%{BKY_VARIABLES_GET_HELPURL}"

- type: variables_set
  message0: 设置 %1
  args0: [*variable_var]
  message1: 为 %1
  args1: [*statement_body]
  message2: "显示 %1"
  args2:
    - &checkbox_echo
      type: field_checkbox
      name: ECHO
  <<: &variables_set
    <<: *variable_blocks
    tooltip: "%{BKY_VARIABLES_SET_TOOLTIP}"
    helpUrl: "%{BKY_VARIABLES_SET_HELPURL}"

- type: variables_set_block
  message0: 设置 %1
  args0:
    - type: input_statement
      name: VAR
  message1: 为 %1
  args1: [*statement_body]
  message2: "显示 %1"
  args2: [*checkbox_echo]
  <<: *variables_set

- type: variables_get_linger
  message0: 导入 %1
  args0:
    - &input_scope
      type: field_input
      name: SCOPE
      text: scope
  <<: &variable_dynamic_blocks
    <<: *variable_blocks
    style: variable_dynamic_blocks

- type: variables_set_linger
  message0: 导出 %1 到 %2
  args0: [*variable_var, *input_scope]
  <<: *variable_dynamic_blocks

- type: inner_value_set
  message0: 写入内部值 %1 名 %2
  args0:
    - { type: field_input, name: FIELD, text: Range }
    - { type: field_input, name: NAME }
  message1: 值 %1
  args1: [*statement_body]
  message2: 输出 %1
  args2: [*checkbox_echo]
  <<:
    <<: *statements
    style: variable_blocks
    tooltip: 把值写进内部值表（作用域通常是 Range / Choice / Lex）

- type: inner_value_get
  message0: 读取内部值 %1 名 %2
  args0:
    - { type: field_input, name: FIELD }
    - { type: field_input, name: NAME }
  <<:
    <<: *statements
    style: variable_blocks
    tooltip: 读取内部值；作用域留空时按翻译器顺序查找

# Settings ====================================================================

- type: config
  message0: 配置 %1
  args0:
    - type: field_dropdown
      name: ITEM
      options:
        - [允许变量名含下划线 vu, vu]
        - [禁止变量名含下划线, disable_cache_name_with_underscore]
        - [出错忽略 eig, eig]
        - [出错原样 ea, ea]
        - [出错缩写 eil, eil]
        - [出错抛错 er, er]
        - [计算输出上限 512, max_calculate_output_normal]
        - [计算输出上限 1024 cl, cl]
        - [计算输出无限 cu, cu]
        - [关闭 PUA 提示, disable_pua_warning]
        - [开启 PUA 提示, enable_pua_warning]
        - [关闭复制提示, disable_repeat_warning]
        - [开启复制提示, enable_repeat_warning]
        - [关闭词库提示, disable_lex_warning]
        - [开启词库提示, enable_lex_warning]
        - [大数走沙盒 cb, cb]
        - [关闭大数沙盒, disable_calc_bignum]
        - [除零为 inf zinf, zinf]
        - [除零为 nan znan, znan]
        - [除零为 0 zzero, zzero]
        - [除零报错 zerr, zerr]
  <<:
    <<: *statements
    style: text_blocks
    tooltip: 设置本次填字的配置项，输出为空

- type: nocensor
  message0: 关闭屏蔽 %1
  args0:
    - { type: field_input, name: OTP }
  <<:
    <<: *statements
    style: text_blocks
    tooltip: 用 6 位验证码关闭本次填字的屏蔽词；不填会提示当前验证码

- type: reset
  message0: 重置 %1
  args0:
    - { type: field_input, name: SEED }
  <<:
    <<: *statements
    style: text_blocks
    tooltip: 清空缓存与变量并重置随机；种子应放在最前面
