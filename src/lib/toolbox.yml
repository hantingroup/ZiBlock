kind: categoryToolbox

contents:
  # Text ======================================================================
  - kind: category
    name: 文本
    colour: "%{BKY_TEXTS_HUE}"
    contents:
      # - { kind: block, type: text }
      - { kind: block, type: text_multiline }
      # - { kind: block, type: translate }
      # - { kind: block, type: translate_multiline }
      # - { kind: block, type: translate_block }
      - kind: block
        type: slice
        inputs:
          BODY:
            shadow:
              type: text_multiline
      - kind: block
        type: font
        inputs:
          BODY:
            shadow:
              type: text_multiline
      - kind: block
        type: filter
        inputs:
          BODY:
            shadow:
              type: text_multiline
      - { kind: block, type: alias }
      - { kind: block, type: alias_value }
      - { kind: block, type: join }
      - { kind: block, type: lexicon }
      - { kind: block, type: lexicon_value }

  # Math ======================================================================
  - kind: category
    name: 数学
    colour: "%{BKY_MATH_HUE}"
    contents:
      - { kind: block, type: number }
      - { kind: block, type: calculate }
      - { kind: block, type: choice }
      - { kind: block, type: range }
      - { kind: block, type: range_value }
      - kind: block
        type: format
        inputs:
          BODY: &shadow_multiline
            shadow:
              type: text_multiline
      - kind: block
        type: reduce_calc
        inputs:
          BODY: *shadow_multiline

  # Controls ==================================================================
  - kind: category
    name: 循环
    colour: "%{BKY_LOOPS_HUE}"
    contents:
      - { kind: block, type: controls_repeat }

  # Variables =================================================================
  - kind: category
    name: 变量
    colour: "%{BKY_VARIABLES_HUE}"
    contents:
      - { kind: block, type: variables_get }
      - { kind: block, type: variables_get_value }
      - { kind: block, type: variables_set }
      - { kind: block, type: variables_set_block }
      - { kind: block, type: variables_get_linger }
      - { kind: block, type: variables_get_linger_value }
      - { kind: block, type: variables_set_linger }
      - kind: block
        type: inner_value_set
        inputs:
          BODY: *shadow_multiline
      - { kind: block, type: inner_value_get }
      - { kind: block, type: inner_value_get_value }

  # Settings ==================================================================
  - kind: category
    name: 设置
    colour: "%{BKY_TEXTS_HUE}"
    contents:
      - { kind: block, type: config }
      - { kind: block, type: reset }
      - { kind: block, type: nocensor }
