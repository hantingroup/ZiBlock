kind: categoryToolbox

contents:
  # Text ======================================================================
  - kind: category
    name: 文本
    colour: "%{BKY_TEXTS_HUE}"
    contents:
      # - { kind: block, type: text }
      - { kind: block, type: text_multiline }
      # - { kind: block, type: translate }
      # - { kind: block, type: translate_multiline }
      # - { kind: block, type: translate_block }
      - { kind: block, type: slice }
      - { kind: block, type: transform }
      - { kind: block, type: alias }
      # Query conditions live in the lexicon block's gear palette.
      - { kind: block, type: lexicon }

  # Math ======================================================================
  - kind: category
    name: 数学
    colour: "%{BKY_MATH_HUE}"
    contents:
      - { kind: block, type: number }
      - { kind: block, type: calculate }
      - { kind: block, type: choice }
      - { kind: block, type: range }
      - { kind: block, type: format }
      - { kind: block, type: reduce_calc }

  # Controls ==================================================================
  - kind: category
    name: 循环
    colour: "%{BKY_LOOPS_HUE}"
    contents:
      - { kind: block, type: controls_repeat }

  # Variables =================================================================
  - kind: category
    name: 变量
    colour: "%{BKY_VARIABLES_HUE}"
    contents:
      - { kind: block, type: variables_get }
      - { kind: block, type: variables_set }
      - { kind: block, type: variables_set_block }
      - { kind: block, type: variables_get_linger }
      - { kind: block, type: variables_set_linger }
      - { kind: block, type: inner_value_set }
      - { kind: block, type: inner_value_get }

  # Settings ==================================================================
  - kind: category
    name: 设置
    colour: 20
    contents:
      - { kind: block, type: config }
      - { kind: block, type: reset }
      - { kind: block, type: nocensor }
