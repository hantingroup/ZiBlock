# Text/number fields become Scratch-style value slots when the blocks load:
# `field_input`, `field_number` and `field_multilinetext` arguments are turned
# into value inputs with editable literal shadow blocks (see shadow-slots.ts),
# so a value reporter can be dropped onto any of them. `field_dropdown` and
# `field_variable` are converted the same way when the argument sets
# `shadow: true`.
#
# Every general block is a string expression (output String). Statement
# connections are reserved for the lexicon query C-shaped editor below.

# Text ========================================================================

- type: text_multiline
  message0: ¶ %1
  args0:
    - { type: field_multilinetext, name: TEXT, shadow: false }
  <<:
    - <<: &text
        <<: &statements
          output: "String"
          extensions: [dual_connection]
        style: text_blocks
      tooltip: "%{BKY_TEXT_TEXT_TOOLTIP}"
      helpUrl: "https://tianzi.hongbot.icu/howto#混排"

- type: slice
  message0: 切片 %1
  args0:
    # A multiline field, so the target slot starts with an editable text shadow.
    - { type: field_multilinetext, name: BODY }
  message1: 从 %1 到 %2 步长 %3
  args1:
    - { type: field_number, name: START, value: 0 }
    - { type: field_number, name: STOP }
    - { type: field_number, name: STEP }
  <<:
    <<: *text
    tooltip: 按 Python 切片语义从目标文本中切出一段
    helpUrl: "https://tianzi.hongbot.icu/howto#Slice"

- type: transform
  inputsInline: false
  message0: "%1 %2 字符集 %3 写名 %4"
  args0:
    - { type: field_transform_name, name: OP }
    # A multiline field, so the target slot starts with an editable text shadow.
    - { type: field_multilinetext, name: BODY }
    - { type: field_input, name: CHARSET }
    - { type: field_input, name: CNAME }
  <<:
    <<: *text
    tooltip: 对目标文本应用字体或滤镜；字符集只对字体有效
    helpUrl: "https://tianzi.hongbot.icu/howto#StrFilter"
    extensions: [transform_charset_visibility, dual_connection]

- type: macro
  message0: 宏 %1
  args0:
    - { type: field_macro_name, name: MACRO }
  <<:
    <<: *text
    tooltip: 展开宏表里的宏；也可以直接输入
    helpUrl: "https://tianzi.hongbot.icu/howto#语言基础"

- type: lexicon
  message0: "词库 %1 输出 %2"
  args0:
    - { type: field_lexicon_name, name: NAME }
    - { type: field_lexicon_field, name: FIELD }
  message1: "查询 %1"
  args1:
    -
      type: input_statement
      name: QUERY
      check: "TzQuery"
  message2: "写名 %1"
  args2:
    - { type: field_input, name: CNAME }
  <<:
    <<: *text
    style: lexicon_blocks
    tooltip: 查询按行「与」组合；「或者」分隔不同的「或」分支
    helpUrl: "https://tianzi.hongbot.icu/howto#词库"
    extensions: [lexicon_block, dual_connection]

# Lexicon query blocks =======================================================
# The query is a C-shaped statement input. Each condition line is one segment;
# consecutive lines are joined with & (AND). A bare 或者 separator starts a new
# | (OR) branch, so the stack maps directly onto the DSL grammar without
# parentheses. 取反 and 组 are C-shaped wrappers around a query expression;
# 取反 is expanded with De Morgan when it wraps several conditions or branches.

- type: lexicon_or
  message0: "或者"
  previousStatement: "TzQuery"
  nextStatement: "TzQuery"
  style: lexicon_blocks
  tooltip: 分隔两个「或」分支；上下两侧各自按「与」组合，不接任何积木
  helpUrl: "https://tianzi.hongbot.icu/howto#常用扩展语法词库"

- type: lexicon_not
  message0: "取反 %1"
  args0:
    - type: input_statement
      name: ITEM
      check: "TzQuery"
  previousStatement: "TzQuery"
  nextStatement: "TzQuery"
  style: lexicon_blocks
  extensions: [lexicon_not_block]
  tooltip: 包住查询条件并整体取反；多个「与」条件展开为 !a|!b，多个「或」分支展开为 !a&!b
  helpUrl: "https://tianzi.hongbot.icu/howto#常用扩展语法词库"

- type: lexicon_group
  message0: "组 %1 %2"
  args0:
    - { type: field_group_name, name: GROUP }
    - type: input_statement
      name: ITEM
      check: "TzQuery"
  previousStatement: "TzQuery"
  nextStatement: "TzQuery"
  style: lexicon_blocks
  extensions: [lexicon_group_block]
  tooltip: 给包住的每个条件加 @组；「与」行和「或」分支里的条件都会加组
  helpUrl: "https://tianzi.hongbot.icu/howto#常用扩展语法词库"

- type: lexicon_pinyin
  message0: "拼音 %1"
  args0:
    - { type: field_input, name: PATTERN }
  <<: &condition_statement
    previousStatement: "TzQuery"
    nextStatement: "TzQuery"
    style: lexicon_blocks
  extensions: [lexicon_condition]
  helpUrl: "https://tianzi.hongbot.icu/howto#拼音"

- type: lexicon_pinyin_regex
  message0: "拼音正则 %1"
  args0:
    - { type: field_input, name: PATTERN }
  <<: *condition_statement
  extensions: [lexicon_condition]
  helpUrl: "https://tianzi.hongbot.icu/howto#拼音正则"

- type: lexicon_length
  message0: "长度 %1 %2"
  args0:
    - type: field_dropdown
      name: COMPARISON
      options:
        - ["等于", "eq"]
        - ["大于", "gt"]
        - ["小于", "lt"]
        - ["不小于", "gte"]
        - ["不大于", "lte"]
    - { type: field_number, name: LENGTH, value: 2, min: 0, precision: 1 }
  <<: *condition_statement
  extensions: [lexicon_condition]
  helpUrl: "https://tianzi.hongbot.icu/howto#词长"

- type: lexicon_path
  message0: "路径 %1 %2"
  args0:
    - { type: field_input, name: PATH, text: "/山东省/济南市" }
    - type: field_dropdown
      name: DEPTH
      options:
        - ["直接子节点", "children"]
        - ["所有后代", "descendants"]
  <<: *condition_statement
  extensions: [lexicon_condition]
  helpUrl: "https://tianzi.hongbot.icu/howto#路径"

- type: lexicon_enum
  message0: "枚举 %1"
  args0:
    - { type: field_enum_value, name: VALUE }
  <<: *condition_statement
  extensions: [lexicon_condition, lexicon_enum_block]
  helpUrl: "https://tianzi.hongbot.icu/howto#枚举"

- type: lexicon_index
  message0: "索引 %1 到 %2"
  args0:
    - { type: field_number, name: START, value: 0, min: 0, precision: 1 }
    - { type: field_number, name: END, value: 100, min: 1, precision: 1 }
  <<: *condition_statement
  extensions: [lexicon_condition]
  helpUrl: "https://tianzi.hongbot.icu/howto#索引"

- type: lexicon_regex
  message0: "正则 %1"
  args0:
    - { type: field_input, name: SOURCE }
  <<: *condition_statement
  extensions: [lexicon_condition]
  helpUrl: "https://tianzi.hongbot.icu/howto#正则"

# Math ========================================================================

- type: number
  message0: "# %1"
  args0:
    - { type: field_number, name: TEXT, value: 0 }
  <<:
    - <<: &math_blocks
        <<: *statements
        style: math_blocks
      tooltip: "%{BKY_MATH_NUMBER_TOOLTIP}"
      helpUrl: "https://tianzi.hongbot.icu/howto#ImmediateNumbers"

- type: calculate
  message0: = %1
  args0:
    - type: field_input
      name: TEXT
  <<:
    <<: *math_blocks
    tooltip: "%{BKY_MATH_CALCULATE_TOOLTIP}"
    helpUrl: "https://tianzi.hongbot.icu/howto#Calculate"

- type: range
  inputsInline: false
  message0: 随机数 %1 到 %2
  args0:
    - { type: field_input, name: LEFT, text: "1" }
    - { type: field_input, name: RIGHT, text: "9" }
  message1: 格式 %1 字形 %2
  args1:
    - { type: field_input, name: FSPEC }
    - type: field_dropdown
      name: FUSR
      # `shadow: true` turns the dropdown into a replaceable value slot.
      shadow: true
      options:
        - [自动, ""]
        - [十进制 d, d]
        - [十六进制 x, x]
        - [十六进制 X, X]
        - [中文 cn, cn]
        - [中文大写 CN, CN]
        - [罗马 ro, ro]
        - [罗马 Unicode RO, RO]
        - [字符 u, u]
  message2: 分布 %1 读名 %2 写名 %3
  args2:
    - type: field_dropdown
      name: DIST
      shadow: true
      options:
        - [无, ""]
        - [正态, n]
        - [学生 t, t]
        - [卡方, x]
        - [F 分布, f]
        - [指数, e]
        - [柯西, c]
        - [威布尔, w]
        - [伽马, g]
        - [贝塔, β]
        - [对数正态, log]
        - [逻辑, logistic]
        - [拉普拉斯, l]
    - { type: field_input, name: RNAME }
    - { type: field_input, name: CNAME }
  message3: 分隔符 %1 数量 %2
  args3:
    - { type: field_input, name: CSEP }
    - { type: field_input, name: COUNT }
  <<:
    <<: *math_blocks
    tooltip: 在左右边界之间取随机数；输出会贴合两端边界的字形与格式
    helpUrl: "https://tianzi.hongbot.icu/howto#Range"

- type: format
  inputsInline: false
  message0: 格式化 %1
  args0:
    - &statement_body
      type: input_value
      name: BODY
  message1: 格式 %1 字形 %2
  args1:
    - { type: field_input, name: FSPEC, text: ".2f" }
    - type: field_dropdown
      name: FUSR
      shadow: true
      options:
        - [十进制 d, d]
        - [无, ""]
        - [十六进制 x, x]
        - [十六进制 X, X]
        - [中文 cn, cn]
        - [中文大写 CN, CN]
        - [罗马 ro, ro]
        - [罗马 Unicode RO, RO]
        - [字符 u, u]
  message2: 写名 %1
  args2:
    - { type: field_input, name: CNAME }
  <<:
    <<: *math_blocks
    tooltip: 把目标值按格式与字形重新渲染（不随机）
    helpUrl: "https://tianzi.hongbot.icu/howto#就地格式化"

# Controls ====================================================================

- type: controls_repeat
  message0: 重复 %1 次
  args0:
    - # &number_times
      type: field_number
      name: TIMES
      value: 10
      min: 0
      precision: 1
  message1: "%1"
  args1:
    - type: input_statement
      name: BODY
      check: "TzText"
  message2: 懒加载 %1
  args2: 
    - type: field_checkbox
      name: LAZY
      checked: TRUE
  <<:
    - *statements
    - <<: # &loop_blocks
        style: loop_blocks
        <<: *statements
      tooltip: "%{BKY_CONTROLS_REPEAT_TOOLTIP}"
      helpUrl: "https://tianzi.hongbot.icu/howto#重复small--下small"

# Variables ===================================================================

- type: variables_get
  message0: "%1"
  args0:
    - &variable_var
      type: field_variable
      name: VAR
      variable: "%{BKY_VARIABLES_DEFAULT_NAME}"
  <<:
    <<: &variable_blocks
      <<: *statements
      style: variable_blocks
      extensions: [dual_connection, contextMenu_variableSetterGetter]
    tooltip: "%{BKY_VARIABLES_GET_TOOLTIP}"
    helpUrl: "https://tianzi.hongbot.icu/howto#引用-reference"

- type: variables_set
  # Like 随机数: every slot gets its own row.
  inputsInline: false
  message0: 设置 %1 为 %2
  args0:
    # Both parts are value slots. The 写名 starts on a variable dropdown, the
    # value on an empty editable literal; either can be covered by a block.
    - &variable_slot
      type: field_variable
      name: VAR
      variable: "%{BKY_VARIABLES_DEFAULT_NAME}"
      shadow: true
    - { type: field_input, name: BODY }
  message1: "显示 %1"
  args1:
    - &checkbox_echo
      type: field_checkbox
      name: ECHO
  # No variable field any more, so the variable get/set context menu (which
  # expects a VAR field) does not apply.
  <<: *statements
  style: variable_blocks
  tooltip: "%{BKY_VARIABLES_SET_TOOLTIP}"
  helpUrl: "https://tianzi.hongbot.icu/howto#赋值"

- type: variables_get_linger
  message0: 导入 %1
  args0:
    - &input_scope
      type: field_input
      name: SCOPE
      text: scope
  <<: &variable_dynamic_blocks
    <<: *variable_blocks
    style: variable_blocks
  helpUrl: "https://tianzi.hongbot.icu/howto#LingerRef"

- type: variables_set_linger
  message0: 导出 %1 到 %2
  # The variable name is a slot as well, so it can be computed.
  args0: [*variable_slot, *input_scope]
  <<: *variable_dynamic_blocks
  # The variable context menu needs a VAR field, which the slot replaced.
  extensions: [dual_connection]
  helpUrl: "https://tianzi.hongbot.icu/howto#LingerAssign"

- type: inner_value_set
  # Like 随机数: every slot gets its own row.
  inputsInline: false
  message0: 写入内部值 %1 名 %2
  args0:
    - { type: field_input, name: FIELD, text: Range }
    - { type: field_input, name: NAME }
  message1: 值 %1
  # A value slot with an empty literal, so the block starts on an editable
  # text field rather than an empty socket.
  args1: [{ type: field_input, name: BODY }]
  message2: 输出 %1
  args2: [*checkbox_echo]
  <<:
    <<: *statements
    style: variable_blocks
    tooltip: 把值写进内部值表（作用域通常是 Range / Choice / Lex）
    helpUrl: "https://tianzi.hongbot.icu/howto#InnerValAssign"

- type: inner_value_get
  message0: 读取内部值 %1 名 %2
  args0:
    - { type: field_input, name: FIELD }
    - { type: field_input, name: NAME }
  <<:
    <<: *statements
    style: variable_blocks
    tooltip: 读取内部值；作用域留空时按翻译器顺序查找
    helpUrl: "https://tianzi.hongbot.icu/howto#InnerValRef"

# Settings ====================================================================

- type: config
  message0: 配置 %1
  args0:
    - type: field_dropdown
      name: ITEM
      options:
        - [允许变量名含下划线 vu, vu]
        - [禁止变量名含下划线, disable_cache_name_with_underscore]
        - [出错忽略 eig, eig]
        - [出错原样 ea, ea]
        - [出错缩写 eil, eil]
        - [出错抛错 er, er]
        - [计算输出上限 512, max_calculate_output_normal]
        - [计算输出上限 1024 cl, cl]
        - [计算输出无限 cu, cu]
        - [关闭 PUA 提示, disable_pua_warning]
        - [开启 PUA 提示, enable_pua_warning]
        - [关闭复制提示, disable_repeat_warning]
        - [开启复制提示, enable_repeat_warning]
        - [关闭词库提示, disable_lex_warning]
        - [开启词库提示, enable_lex_warning]
        - [大数走沙盒 cb, cb]
        - [关闭大数沙盒, disable_calc_bignum]
        - [除零为 inf zinf, zinf]
        - [除零为 nan znan, znan]
        - [除零为 0 zzero, zzero]
        - [除零报错 zerr, zerr]
  <<:
    <<: *statements
    style: setting_blocks
    tooltip: 设置本次填字的配置项，输出为空
    helpUrl: "https://tianzi.hongbot.icu/howto#Config"

- type: nocensor
  message0: 关闭屏蔽 %1
  args0:
    - { type: field_input, name: OTP }
  <<:
    <<: *statements
    style: setting_blocks
    tooltip: 用 6 位验证码关闭本次填字的屏蔽词；不填会提示当前验证码
    helpUrl: "https://tianzi.hongbot.icu/howto#Nocensor"

- type: reset
  message0: 重置 %1
  args0:
    - { type: field_input, name: SEED }
  <<:
    <<: *statements
    style: setting_blocks
    tooltip: 清空缓存与变量并重置随机；种子应放在最前面
    helpUrl: "https://tianzi.hongbot.icu/howto#Reset"
